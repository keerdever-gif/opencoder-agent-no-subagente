<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCoder Agent</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="shell"><header><img src="/static/opencoder.gif" alt="OpenCoder"><div><h1>OpenCoder</h1><p>Agente de programación · modo web · sin subagentes</p></div></header><section id="login" class="panel"><h2>Acceso</h2><p>Introduce el token configurado en el servidor.</p><form id="loginForm"><input id="token" type="password" autocomplete="current-password" placeholder="Token de acceso" required><button>Entrar</button></form><p id="loginError" class="error"></p></section><section id="chat" class="panel hidden"><div id="messages" aria-live="polite"><div class="message assistant">Hola. ¿Qué quieres construir o revisar?</div></div><form id="chatForm"><textarea id="prompt" rows="3" placeholder="Describe lo que quieres programar…" required></textarea><div class="actions"><span id="status">Listo</span><button id="send">Enviar</button></div></form></section></main><script src="/static/app.js"></script></body></html>
